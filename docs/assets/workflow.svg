<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc">
  <title id="title">四季光伏工具箱工作流程示意</title>
  <desc id="desc">保存图纸副本并用 JJJJ 打开工具箱，选择导轨、配重或文字翻译流程，最后人工复核成果。此图不是软件截图或工程图纸。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker>
  </defs>
  <rect width="1120" height="620" rx="24" fill="#f1f5f9"/>
  <g font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif">
    <text x="40" y="57" font-size="29" font-weight="700" fill="#0f172a">四季光伏工具箱</text>
    <text x="40" y="88" font-size="17" fill="#475569">从重复绘图到可复核的成果 · AutoCAD 2020 Win64 / R23.1</text>
    <rect x="40" y="117" width="1040" height="64" rx="12" fill="#0f172a"/>
    <text x="64" y="157" font-size="21" fill="#fff">01  保存图纸副本</text>
    <text x="405" y="157" font-size="21" fill="#fff">02  输入 JJJJ 打开工具箱</text>
    <path d="M300 149H374" stroke="#cbd5e1" stroke-width="2"/>
    <path d="M560 181V214M210 214H910M210 214V238M560 214V238M910 214V238" fill="none" stroke="#64748b" stroke-width="2"/>
    <g>
      <rect x="40" y="238" width="330" height="212" rx="14" fill="#fff" stroke="#cbd5e1"/>
      <rect x="40" y="238" width="330" height="8" rx="4" fill="#0284c7"/>
      <text x="64" y="285" font-size="24" font-weight="700" fill="#075985">自动画导轨</text>
      <text x="64" y="322" font-size="18" fill="#334155">设置参数 → 样本与范围</text>
      <text x="64" y="356" font-size="18" fill="#334155">预览确认 → 导轨总米数统计</text>
      <text x="64" y="418" font-size="16" fill="#64748b">不生成尺寸标注</text>
      <rect x="395" y="238" width="330" height="212" rx="14" fill="#fff" stroke="#cbd5e1"/>
      <rect x="395" y="238" width="330" height="8" rx="4" fill="#0d9488"/>
      <text x="419" y="285" font-size="24" font-weight="700" fill="#115e59">自动布置配重</text>
      <text x="419" y="322" font-size="18" fill="#334155">识别阵列 → 按排设置</text>
      <text x="419" y="356" font-size="18" fill="#334155">生成配重 → 分尺寸统计</text>
      <text x="419" y="418" font-size="16" fill="#64748b">组件阵列清单与配重表分开</text>
      <rect x="750" y="238" width="330" height="212" rx="14" fill="#fff" stroke="#cbd5e1"/>
      <rect x="750" y="238" width="330" height="8" rx="4" fill="#7c3aed"/>
      <text x="774" y="285" font-size="24" font-weight="700" fill="#5b21b6">图纸文字翻译</text>
      <text x="774" y="322" font-size="18" fill="#334155">配置接口 → 选择文字</text>
      <text x="774" y="356" font-size="18" fill="#334155">直接替换 / 确认后替换</text>
      <text x="774" y="418" font-size="16" fill="#64748b">文字会发送至配置的 API 服务</text>
    </g>
    <path d="M210 450V476H910V450M560 450V493" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="40" y="502" width="1040" height="60" rx="12" fill="#e2e8f0"/>
    <text x="64" y="540" font-size="20" font-weight="700" fill="#0f172a">03  人工复核尺寸、数量与译文，再保存和交付</text>
    <text x="40" y="594" font-size="16" fill="#64748b">原创流程示意 · 非软件截图、非工程图纸 · 绘图与统计不能替代工程设计及验收</text>
  </g>
</svg>
